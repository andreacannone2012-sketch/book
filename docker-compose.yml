services:
  schoolbook-studio:
    # Sostituisci OWNER/REPO con utente/nome-repository GitHub, tutto in minuscolo
    image: ghcr.io/OWNER/REPO:latest
    container_name: schoolbook-studio
    restart: unless-stopped
    ports:
      # 8431 fuori, 8000 dentro: non va in conflitto con lavagna-ai (8430) e immich-kiosk (3000)
      - "8431:8000"
    environment:
      DATA_DIR: /data
      DOWNLOAD_WORKERS: "2"
      SESSION_TTL_SECONDS: "28800"
    volumes:
      # I PDF scaricati finiscono qui, visibili da File di ZimaOS
      - /DATA/AppData/schoolbook-studio:/data
